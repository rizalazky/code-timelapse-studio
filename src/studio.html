<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Code Timelapse Studio</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #1e1e1e;
    --border: #2d2d2d;
    --text: #d4d4d4;
    --accent: #569cd6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
  }
  #stage {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: row; /* default: horizontal, side by side */
  }
  #stage.vertical {
    flex-direction: column; /* stacked */
  }
  #stage.vertical #preview-panel {
    order: -1; /* preview on top, code below */
  }

  .panel {
    position: relative;
    flex: 1 1 50%;
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel);
  }

  .titlebar {
    height: 34px;
    flex: 0 0 auto;
    background: #323233;
    display: flex; align-items: center;
    padding: 0 12px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .titlebar span.label {
    margin-left: 10px;
    color: #9d9d9d;
    font-size: 12px;
  }

  #code-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    /* hide the scrollbar itself so it doesn't show up in the recording */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #code-wrap::-webkit-scrollbar { display: none; }
  #code-content {
    margin: 0;
    padding: 16px 18px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
    min-height: 100%;
    box-sizing: border-box;
  }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* very small keyword-ish highlighter, purely cosmetic */
  .tok-tag { color: #569cd6; }
  .tok-attr { color: #9cdcfe; }
  .tok-str { color: #ce9178; }
  .tok-comment { color: #6a9955; }
  .tok-keyword { color: #c586c0; }
  .tok-prop    { color: #9cdcfe; }
  .tok-num     { color: #b5cea8; }
  .tok-func    { color: #dcdcaa; }

  #preview-wrap {
    flex: 1 1 auto;
    background: #fff;
    position: relative;
    overflow: hidden; /* biar zoom gak bocor keluar panel */
  }
  #preview {
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #fff;
    transform-origin: center center;
  }
  #reveal-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 400ms ease;
    z-index: 5;
  }
  #reveal-overlay.active { opacity: 1; }
</style>
</head>
<body>
  <div id="stage">
    <div class="panel" id="code-panel">
      <div class="titlebar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <span class="label">index.html</span>
      </div>
      <div id="code-wrap">
        <pre id="code-content"><span id="code-text"></span><span class="cursor"></span></pre>
      </div>
    </div>
    <div class="panel" id="preview-panel">
      <div class="titlebar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <span class="label">live preview</span>
      </div>
      <div id="preview-wrap">
        <div id="reveal-overlay"></div>
        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const orientation = params.get('orientation') || 'horizontal';
  const isVertical = orientation === 'vertical';
  if (isVertical) {
    document.getElementById('stage').classList.add('vertical');
  }

  const codeTextEl = document.getElementById('code-text');
  const codeWrap = document.getElementById('code-wrap');
  const iframe = document.getElementById('preview');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // ---- Single-pass tokenizers (one per language) ----
  // Each walks the RAW source once and builds escaped+highlighted HTML
  // directly, instead of chaining regex .replace() calls on top of
  // already-highlighted output (which risks re-matching text sitting
  // inside a previously injected <span class="..."> tag).

  function htmlHighlight(s) {
    const re = new RegExp(
      '(<!--[\\s\\S]*?--' + '>)' +                       // comment
      '|(<!DOCTYPE[^>]*>)' +                              // doctype
      '|(<\\/?[a-zA-Z][\\w-]*)' +                         // open/close tag start
      '|([a-zA-Z_:][\\w:-]*)(=)' +                        // attr=
      '("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')' + // attr value
      '|(\\/?>)',                                          // tag end
      'gi'
    );
    let out = '', last = 0, m;
    while ((m = re.exec(s))) {
      out += escapeHtml(s.slice(last, m.index));
      if (m[1]) out += '<span class="tok-comment">' + escapeHtml(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-tag">' + escapeHtml(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-tag">' + escapeHtml(m[3]) + '</span>';
      else if (m[4] !== undefined) {
        out += '<span class="tok-attr">' + escapeHtml(m[4]) + '</span>=' +
              '<span class="tok-str">' + escapeHtml(m[6]) + '</span>';
      } else if (m[7]) {
        out += escapeHtml(m[7]);
      }
      last = re.lastIndex;
    }
    out += escapeHtml(s.slice(last));
    return out;
  }

  function cssHighlight(s) {
    const re = /(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(@[a-zA-Z-]+)|(#[0-9a-fA-F]{3,8}\b)|(-?\d+\.?\d*(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr)?)|([a-zA-Z-]+)(?=\s*:)/g;
    let out = '', last = 0, m;
    while ((m = re.exec(s))) {
      out += escapeHtml(s.slice(last, m.index));
      if (m[1]) out += '<span class="tok-comment">' + escapeHtml(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-str">' + escapeHtml(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-keyword">' + escapeHtml(m[3]) + '</span>';
      else if (m[4]) out += '<span class="tok-num">' + escapeHtml(m[4]) + '</span>';
      else if (m[5]) out += '<span class="tok-num">' + escapeHtml(m[5]) + '</span>';
      else if (m[6]) out += '<span class="tok-prop">' + escapeHtml(m[6]) + '</span>';
      last = re.lastIndex;
    }
    out += escapeHtml(s.slice(last));
    return out;
  }

  function jsHighlight(s) {
    const re = /(\/\/[^\n]*)|(\/\*[\s\S]*?\*\/)|("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|return|if|else|for|while|do|switch|case|break|continue|class|extends|new|this|typeof|instanceof|in|of|try|catch|finally|throw|async|await|yield|import|export|default|null|undefined|true|false|void|delete|static|get|set)\b|\b(\d+\.?\d*)\b|([a-zA-Z_$][\w$]*)(?=\s*\()/g;
    let out = '', last = 0, m;
    while ((m = re.exec(s))) {
      out += escapeHtml(s.slice(last, m.index));
      if (m[1]) out += '<span class="tok-comment">' + escapeHtml(m[1]) + '</span>';
      else if (m[2]) out += '<span class="tok-comment">' + escapeHtml(m[2]) + '</span>';
      else if (m[3]) out += '<span class="tok-str">' + escapeHtml(m[3]) + '</span>';
      else if (m[4]) out += '<span class="tok-keyword">' + escapeHtml(m[4]) + '</span>';
      else if (m[5]) out += '<span class="tok-num">' + escapeHtml(m[5]) + '</span>';
      else if (m[6]) out += '<span class="tok-func">' + escapeHtml(m[6]) + '</span>';
      last = re.lastIndex;
    }
    out += escapeHtml(s.slice(last));
    return out;
  }

  function highlightForType(type, text) {
    if (type === 'style') return cssHighlight(text);
    if (type === 'script') return jsHighlight(text);
    return htmlHighlight(text);
  }

  function findBlock(code, tagName) {
    const openRe = new RegExp('<' + tagName + '(\\s[^>]*)?>', 'i');
    const openMatch = openRe.exec(code);
    if (!openMatch) return null;
    const start = openMatch.index + openMatch[0].length;
    const end = code.toLowerCase().indexOf('</' + tagName + '>', start);
    if (end === -1) return null;
    return { start, end };
  }

  function splitDoc(code) {
    const styleBlock = findBlock(code, 'style');
    const scriptBlock = findBlock(code, 'script');
    const raw = [];
    if (styleBlock) raw.push({ ...styleBlock, type: 'style' });
    if (scriptBlock) raw.push({ ...scriptBlock, type: 'script' });
    raw.sort((a, b) => a.start - b.start);

    let skeleton = '';
    let cursor = 0;
    const blocks = [];
    for (const b of raw) {
      skeleton += code.slice(cursor, b.start);
      blocks.push(analyzeBlock({ text: code.slice(b.start, b.end), insertPoint: skeleton.length, type: b.type }));
      cursor = b.end;
    }
    skeleton += code.slice(cursor);
    return { skeleton, blocks };
  }

  function analyzeBlock(block) {
    const trailingMatch = block.text.match(/\n[ \t]*$/);
    const trailingWhitespace = trailingMatch ? trailingMatch[0] : '';
    return {
      ...block,
      contentEnd: block.text.length - trailingWhitespace.length,
      indent: trailingWhitespace.slice(1),
    };
  }

  // Plain-text reassembly — used for the iframe preview (srcdoc must stay
  // unescaped, real code).
  function assemble(skeleton, blocks, revealedLens, activeIndex) {
    let result = '';
    let cursor = 0;
    for (let i = 0; i < blocks.length; i++) {
      result += skeleton.slice(cursor, blocks[i].insertPoint);
      const revealedText = blocks[i].text.slice(0, revealedLens[i]);
      result += revealedText;
      const stillTypingContent =
        i === activeIndex && revealedLens[i] <= blocks[i].contentEnd && revealedLens[i] < blocks[i].text.length;
      if (stillTypingContent) result += '\n' + blocks[i].indent;
      cursor = blocks[i].insertPoint;
    }
    result += skeleton.slice(cursor);
    return result;
  }

  // Same reassembly but each segment is run through the highlighter that
  // matches its language (HTML skeleton vs. CSS/JS block content), then
  // concatenated — so the code panel gets real per-language coloring
  // instead of one highlighter guessing across the whole mixed string.
  function assembleHighlighted(skeleton, blocks, revealedLens, activeIndex) {
    let result = '';
    let cursor = 0;
    for (let i = 0; i < blocks.length; i++) {
      result += htmlHighlight(skeleton.slice(cursor, blocks[i].insertPoint));
      const revealedText = blocks[i].text.slice(0, revealedLens[i]);
      result += highlightForType(blocks[i].type, revealedText);
      const stillTypingContent =
        i === activeIndex && revealedLens[i] <= blocks[i].contentEnd && revealedLens[i] < blocks[i].text.length;
      if (stillTypingContent) result += '\n' + blocks[i].indent;
      cursor = blocks[i].insertPoint;
    }
    result += htmlHighlight(skeleton.slice(cursor));
    return result;
  }

  window.typeCode = async function typeCode(code, opts) {
    opts = opts || {};
    const charsPerTick = opts.charsPerTick || 3;
    const delayMs = opts.delayMs != null ? opts.delayMs : 12;
    const holdMs = opts.holdMs != null ? opts.holdMs : 3000; // finished-preview hold, ms
    const previewEveryTicks = opts.previewEveryTicks || 1;

    const { skeleton, blocks } = splitDoc(code);
    let previewTickCounter = 0;

    async function render(displayHtml, previewText, isFinalStep) {
      codeTextEl.innerHTML = displayHtml;
      codeWrap.scrollTop = codeWrap.scrollHeight;
      previewTickCounter++;
      if (previewTickCounter % previewEveryTicks === 0 || isFinalStep) {
        iframe.srcdoc = previewText;
      }
    }

    async function typePhase(totalLen, buildDisplay, buildPreview) {
      let revealed = 0;
      while (revealed < totalLen) {
        revealed = Math.min(totalLen, revealed + charsPerTick);
        if (window.__onTypeTick) {
          try { window.__onTypeTick(); } catch (e) { /* ignore */ }
        }
        await render(buildDisplay(revealed), buildPreview(revealed), false);
        await new Promise((r) => setTimeout(r, delayMs));
      }
    }

    // Phase 1: HTML skeleton
    await typePhase(
      skeleton.length,
      (n) => htmlHighlight(skeleton.slice(0, n)),
      (n) => skeleton.slice(0, n)
    );

    // Phase 2+: each block (CSS, then JS) fills into its slot
    const revealedLens = blocks.map(() => 0);
    for (let i = 0; i < blocks.length; i++) {
      await typePhase(
        blocks[i].text.length,
        (n) => { revealedLens[i] = n; return assembleHighlighted(skeleton, blocks, revealedLens, i); },
        (n) => { revealedLens[i] = n; return assemble(skeleton, blocks, revealedLens, i); }
      );
    }

    // black fade -> reveal final result -> slow zoom-in during the hold
    const overlay = document.getElementById('reveal-overlay');
    const previewEl = document.getElementById('preview');

    overlay.classList.add('active');
    await new Promise((r) => setTimeout(r, 300));

    await render(assembleHighlighted(skeleton, blocks, revealedLens, -1), code, true);

    previewEl.style.transition = `transform ${holdMs}ms linear`;
    previewEl.style.transform = 'scale(1.08)';
    requestAnimationFrame(() => overlay.classList.remove('active'));

    await new Promise((r) => setTimeout(r, holdMs));
    window.__DONE__ = true;
    return true;
  };
</script>
</body>
</html>
