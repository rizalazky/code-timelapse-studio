<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Code Timelapse Studio</title>
<style>
  :root {
    --bg: #1e1e1e;
    --panel: #1e1e1e;
    --border: #2d2d2d;
    --text: #d4d4d4;
    --accent: #569cd6;
  }
  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: "SFMono-Regular", Menlo, Consolas, "Courier New", monospace;
  }
  #stage {
    width: 100%; height: 100%;
    display: flex;
    flex-direction: row; /* default: horizontal, side by side */
  }
  #stage.vertical {
    flex-direction: column; /* stacked */
  }
  #stage.vertical #preview-panel {
    order: -1; /* preview on top, code below */
  }

  .panel {
    position: relative;
    flex: 1 1 50%;
    min-width: 0; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel);
  }

  .titlebar {
    height: 34px;
    flex: 0 0 auto;
    background: #323233;
    display: flex; align-items: center;
    padding: 0 12px;
    gap: 6px;
    border-bottom: 1px solid var(--border);
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .dot.red { background: #ff5f56; }
  .dot.yellow { background: #ffbd2e; }
  .dot.green { background: #27c93f; }
  .titlebar span.label {
    margin-left: 10px;
    color: #9d9d9d;
    font-size: 12px;
  }

  #code-wrap {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    /* hide the scrollbar itself so it doesn't show up in the recording */
    scrollbar-width: none;
    -ms-overflow-style: none;
  }
  #code-wrap::-webkit-scrollbar { display: none; }
  #code-content {
    margin: 0;
    padding: 16px 18px;
    white-space: pre-wrap;
    word-break: break-word;
    font-size: 16px;
    line-height: 1.55;
    color: var(--text);
    min-height: 100%;
    box-sizing: border-box;
  }
  .cursor {
    display: inline-block;
    width: 8px; height: 1.1em;
    background: var(--accent);
    vertical-align: text-bottom;
    animation: blink 0.9s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* very small keyword-ish highlighter, purely cosmetic */
  .tok-tag { color: #569cd6; }
  .tok-attr { color: #9cdcfe; }
  .tok-str { color: #ce9178; }
  .tok-comment { color: #6a9955; }

  #preview-wrap {
    flex: 1 1 auto;
    background: #fff;
    position: relative;
  }
  #preview {
    width: 100%; height: 100%;
    border: 0; display: block;
    background: #fff;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="panel" id="code-panel">
      <div class="titlebar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <span class="label">index.html</span>
      </div>
      <div id="code-wrap">
        <pre id="code-content"><span id="code-text"></span><span class="cursor"></span></pre>
      </div>
    </div>
    <div class="panel" id="preview-panel">
      <div class="titlebar">
        <div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div>
        <span class="label">live preview</span>
      </div>
      <div id="preview-wrap">
        <iframe id="preview" sandbox="allow-scripts"></iframe>
      </div>
    </div>
  </div>

<script>
  const params = new URLSearchParams(location.search);
  const orientation = params.get('orientation') || 'horizontal';
  const isVertical = orientation === 'vertical';
  if (isVertical) {
    document.getElementById('stage').classList.add('vertical');
  }

  const codeTextEl = document.getElementById('code-text');
  const codeWrap = document.getElementById('code-wrap');
  const iframe = document.getElementById('preview');

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Cosmetic-only syntax coloring. Not a real parser, just enough to look alive.
  function highlight(s) {
    let out = escapeHtml(s);
    out = out.replace(/(&lt;!--[\s\S]*?--&gt;|\/\/[^\n]*)/g, '<span class="tok-comment">$1</span>');
    out = out.replace(/(&lt;\/?[a-zA-Z0-9]+)/g, '<span class="tok-tag">$1</span>');
    out = out.replace(/(&quot;[^&]*?&quot;|&#39;[^&]*?&#39;)/g, '<span class="tok-str">$1</span>');
    return out;
  }

  /**
   * Locates the inner-content character range [start, end) of the first
   * <tagName>...</tagName> block in `code`. Returns null if absent.
   */
  function findBlock(code, tagName) {
    const openRe = new RegExp('<' + tagName + '(\\s[^>]*)?>', 'i');
    const openMatch = openRe.exec(code);
    if (!openMatch) return null;
    const start = openMatch.index + openMatch[0].length;
    const end = code.toLowerCase().indexOf('</' + tagName + '>', start);
    if (end === -1) return null;
    return { start, end };
  }

  /**
   * Splits `code` into:
   *  - skeleton: the document with <style>/<script> INNER TEXT physically
   *    removed (so e.g. "<style></style>" sit right next to each other —
   *    no reserved blank space for content that hasn't been typed yet)
   *  - blocks: [{ text, insertPoint }] sorted by where they belong in the
   *    skeleton, so they can be spliced back in progressively later
   */
  function splitDoc(code) {
    const styleBlock = findBlock(code, 'style');
    const scriptBlock = findBlock(code, 'script');
    const raw = [];
    if (styleBlock) raw.push(styleBlock);
    if (scriptBlock) raw.push(scriptBlock);
    raw.sort((a, b) => a.start - b.start);

    let skeleton = '';
    let cursor = 0;
    const blocks = [];
    for (const b of raw) {
      skeleton += code.slice(cursor, b.start);
      blocks.push(analyzeBlock({ text: code.slice(b.start, b.end), insertPoint: skeleton.length }));
      cursor = b.end;
    }
    skeleton += code.slice(cursor);
    return { skeleton, blocks };
  }

  /**
 * Analyzes a block's trailing whitespace (the indentation that sits right
 * before its closing tag in the original code) so we can preview it early
 * during typing instead of showing the closing tag jammed up against the
 * last-typed character.
 */
  function analyzeBlock(block) {
    const trailingMatch = block.text.match(/\n[ \t]*$/);
    const trailingWhitespace = trailingMatch ? trailingMatch[0] : '';
    return {
      ...block,
      contentEnd: block.text.length - trailingWhitespace.length,
      indent: trailingWhitespace.slice(1), // strip leading \n, keep just the spaces/tabs
    };
  }

  /** Reassembles skeleton + partially-revealed block text at their insert points.
   *  `activeIndex` = index of the block currently being typed. While that
   *  block's real content hasn't reached its own trailing indentation yet,
   *  we preview a newline + matching indent before continuing into the
   *  skeleton — so the closing tag lands where it will in the final code,
   *  instead of sitting right behind the cursor.
   */
  function assemble(skeleton, blocks, revealedLens, activeIndex) {
    let result = '';
    let cursor = 0;
    for (let i = 0; i < blocks.length; i++) {
      result += skeleton.slice(cursor, blocks[i].insertPoint);
      const revealedText = blocks[i].text.slice(0, revealedLens[i]);
      result += revealedText;

      const stillTypingContent =
        i === activeIndex && revealedLens[i] <= blocks[i].contentEnd && revealedLens[i] < blocks[i].text.length;
      if (stillTypingContent) {
        result += '\n' + blocks[i].indent;
      }

      cursor = blocks[i].insertPoint;
    }
    result += skeleton.slice(cursor);
    return result;
  }

  /**
   * Types `code` in HTML -> CSS -> JS order. Nothing is ever pre-reserved:
   * the CSS/JS text simply doesn't exist in the displayed string until its
   * own phase starts, so no empty gaps appear while earlier phases type.
   */
  window.typeCode = async function typeCode(code, opts) {
    opts = opts || {};
    const charsPerTick = opts.charsPerTick || 3;
    const delayMs = opts.delayMs != null ? opts.delayMs : 12;
    const holdMs = opts.holdMs != null ? opts.holdMs : 1500;
    const previewEveryTicks = opts.previewEveryTicks || 1;
    const reviewSeconds = isVertical ? 3 : 0;

    const { skeleton, blocks } = splitDoc(code);

    const totalChars = skeleton.length + blocks.reduce((s, b) => s + b.text.length, 0);
    const normalTicks = Math.ceil(totalChars / charsPerTick);
    const reviewStartTick = reviewSeconds > 0
      ? Math.max(0, normalTicks - Math.floor((reviewSeconds * 1000) / delayMs))
      : normalTicks;

    let tick = 0;
    let previewTickCounter = 0;

    async function render(text, isFinalStep) {
      codeTextEl.innerHTML = highlight(text);
      codeWrap.scrollTop = codeWrap.scrollHeight;
      previewTickCounter++;
      if (previewTickCounter % previewEveryTicks === 0 || isFinalStep) {
        iframe.srcdoc = text;
      }
    }

    async function typePhase(totalLen, buildText) {
      let revealed = 0;
      while (revealed < totalLen) {
        const inReview = tick >= reviewStartTick && reviewSeconds > 0;
        const rate = inReview ? 1 : charsPerTick;
        const stepDelay = inReview ? Math.max(delayMs, 60) : delayMs;

        revealed = Math.min(totalLen, revealed + rate);
        tick++;
        await render(buildText(revealed), false);
        await new Promise((r) => setTimeout(r, stepDelay));
      }
    }

    // Phase 1: HTML skeleton (structure only — style/script are still empty tags)
    await typePhase(skeleton.length, (n) => skeleton.slice(0, n));

    // Phase 2+: each block (CSS, then JS, in document order) fills into its slot
    const revealedLens = blocks.map(() => 0);
    for (let i = 0; i < blocks.length; i++) {
      await typePhase(blocks[i].text.length, (n) => {
        revealedLens[i] = n;
        return assemble(skeleton, blocks, revealedLens, i); // <-- tambahkan `i` di sini
      });
    }

    // final full render + a short hold so the finished result is visible
    await render(code, true);
    await new Promise((r) => setTimeout(r, holdMs));
    window.__DONE__ = true;
    return true;
  };
</script>
</body>
</html>
