<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Glowing Glass Ball</title>
  <style>
    body {
        background: radial-gradient(circle at center, #0f0f1f, #000010);
        height: 100vh;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
    }

    .glass-ball {
        width: 200px;
        height: 200px;
        background: radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.9), rgba(180, 180, 255, 0.2));
        backdrop-filter: blur(10px);
        border-radius: 50%;
        box-shadow:
            0 0 60px rgba(255, 255, 255, 0.4),
            inset 0 0 25px rgba(255, 255, 255, 0.3);
        position: relative;
        animation: pulse 2s ease-in-out infinite;
    }

    .glass-ball::before {
        content: '';
        position: absolute;
        width: 55px;
        height: 55px;
        background: rgba(255, 255, 255, 0.8);
        top: 20%;
        left: 25%;
        border-radius: 50%;
        filter: blur(10px);
        opacity: 0.9;
    }

    @keyframes pulse {
        0%, 100% {
            transform: scale(1);
            box-shadow:
                0 0 60px rgba(255, 255, 255, 0.4),
                inset 0 0 25px rgba(255, 255, 255, 0.3);
        }
        50% {
            transform: scale(1.04);
            box-shadow:
                0 0 80px rgba(255, 255, 255, 0.6),
                inset 0 0 35px rgba(255, 255, 255, 0.4);
        }
    }
  </style>
</head>
<body>
  <div class="glass-ball"></div>
</body>
</html>
